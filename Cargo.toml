# Cargo workspace root for OpenSpace.
#
# The workspace is the single source of truth for shared metadata
# (edition, license, version axis) and shared dependency versions.
# Individual crates inherit what they need via `workspace = true`.
#
# Membership uses an explicit list for the top-level crates plus a glob
# for sub-features so adding a new sub-feature only requires creating
# its folder, not editing this manifest.

[workspace]
resolver = "2"
members = [
    "crates/app",
    "crates/shared",
    "crates/ai-providers",
    "crates/persistence",
    "crates/feature-welcome",
    "crates/feature-home",
    "crates/feature-home/sub-features/*",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/bengidev/openspace_rustaceans"
rust-version = "1.94"

# Shared dependency versions. Crates opt in per-feature with
# `dep = { workspace = true }`; declaring here prevents version drift.
[workspace.dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tracing = "0.1"
thiserror = "1"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
static_assertions = "1"
proptest = "1"
# `regex` powers the `model_filter` knob on the openai-compatible
# adapter. The filter is a substring/pattern users configure to
# whitelist a subset of `/models` rows; matching as a regex (instead
# of plain substring) gives operators anchors and alternations
# without having to invent another DSL. Pinned at the workspace level
# so later adapters that want to reuse the filter primitive stay on
# the same major version. `default-features = false` cuts the perf
# extras; `std + perf` keeps the optimiser pieces while dropping
# unicode tables we do not need on a model-id corpus.
regex = { version = "1", default-features = false, features = ["std", "perf"] }
# `base64` carries the inline-image encoding for the alternative
# wire-format adapter. Pinned at the workspace level so adapters
# that grow image-input support later cannot drift versions.
base64 = "0.22"
# `chrono` carries the timestamp shape on persisted Domain types. The
# `default-features = false` cut drops the `oldtime` and `wasmbind` extras
# we do not need; `std + serde + clock` keeps `DateTime<Utc>::now()` and
# round-trippable serde wire forms — exactly what the AI Domain slice
# needs and nothing more.
chrono = { version = "0.4", default-features = false, features = ["std", "serde", "clock"] }
# `async-trait` papers over the lack of native `async fn` in trait
# objects on stable Rust. The AI provider trait must be `dyn`-compatible
# so the agent loop can hold it behind `Arc<dyn AiProvider + Send + Sync>`;
# this crate gives us that with a single attribute macro.
async-trait = "0.1"
# `async-stream` is the readability tax-cut on streaming pipelines —
# adapter implementations compose `byte stream → parser → events` as
# a single `try_stream!` block instead of a hand-rolled `unfold` state
# machine. Pinned at the workspace level so every adapter slice (this
# one, the next, the registry) stays on the same major.
async-stream = "0.3"
# `futures` supplies `BoxStream` for the streaming chat surface. We pull
# the umbrella crate (default features) because the AI slice consumes
# both `stream::BoxStream` and the `Stream` extension methods that
# downstream crates will reach for next.
futures = "0.3"
# `reqwest` is the HTTP client every provider adapter talks through.
# Pinned with `rustls-tls` so we keep the security surface predictable
# (no system OpenSSL), `http2` so ALPN can negotiate HTTP/2 with
# upstream services, `json` for ergonomic POST bodies, and `stream`
# so SSE / JSON-NL responses can be consumed lazily without buffering
# the whole body.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "http2", "json", "stream"] }
# `url` is the URL parser reqwest exposes under its own crate. Pinning
# at the workspace level keeps the sandbox-aware HTTP client and any
# downstream URL-building adapters on the same parser semantics.
url = "2"
# `bytes` lets the sandboxed HTTP client surface response chunks to
# downstream parsers (SSE / JSON-NL framing) without copying. The
# workspace pin keeps reqwest and adapters on the same major version.
bytes = "1"
# `wiremock` powers the integration tests that exercise the gate
# matrix and the approval flow. Dev-only — production crates do not
# pull it in.
wiremock = "0.6"
# `toml` rounds out the serde test matrix on persisted Domain types:
# JSON locks the wire shape, TOML locks the settings-file shape. The
# crate is dev-only (only `openspace-shared`'s tests pull it today),
# but it still belongs in the workspace block so future settings-layer
# code does not pick a drifting version.
toml = "0.8"

# Release profile tuned for distributable binaries: full optimisation,
# thin LTO, single codegen unit, stripped symbols, abort on panic. The
# trade-off is longer link times in exchange for smaller, faster output;
# acceptable for an MVP that ships via release artefacts.
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"

# Dev profile keeps our own crates at the default opt-level so iteration
# is fast, but bumps third-party dependencies to opt-level 1 so debug
# builds do not crawl through unoptimised dep code on every run.
[profile.dev.package."*"]
opt-level = 1

# Workspace-level lint policy. Each crate opts in via `[lints] workspace =
# true`, so the rules live in one place and stay in lockstep across the
# tree. CI promotes these warnings to errors via `-D warnings`; locally
# they stay as warnings so iteration is not blocked by stylistic noise
# the developer has not yet addressed.
#
# Notes on choices:
#   - `unsafe_code = "warn"` keeps unsafe deliberate without forbidding it
#     outright; sub-features like terminal will need it eventually.
#   - `unreachable_pub` flags items that are pub but never reachable from
#     the crate root, which is a frequent source of accidental API leak.
#   - `rust_2018_idioms` and `clippy::all` are lint groups; they need
#     `priority = -1` so individual overrides above can still fire.
#   - `missing_docs` is intentionally omitted at this stage — the
#     placeholder modules are scaffolding and adding doc stubs to them
#     would be churn. Re-evaluate once real types land in PRD-01.
[workspace.lints.rust]
unsafe_code = "warn"
unreachable_pub = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
