[package]
name = "openspace-ai-providers"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "AI provider adapters and supporting infrastructure for OpenSpace."

# This crate hosts the runtime-side machinery that turns the
# `openspace-shared::ai::provider::AiProvider` trait surface into
# working backends — the sandbox-aware HTTP client every adapter
# talks through, the secret-store implementations, the streaming
# tool-call accumulator, and (in later slices) the wire-format
# adapters themselves.
#
# Hard rules:
#
#   - Network IO and infrastructure concerns live here, never in
#     `openspace-shared`. The Domain crate must stay testable
#     without a transport runtime.
#   - All outbound traffic goes through `SandboxedHttpClient`,
#     which gates on `SandboxPolicy::check_network` before opening
#     a connection. Adapters never construct a bare
#     `reqwest::Client`.
#   - The trait surface remains provider-agnostic: nothing in this
#     manifest names a vendor or protocol dialect.
[dependencies]
# `openspace-shared` carries the trait surfaces this crate
# implements: `SecretStore`/`SecretRef` for the in-memory backend,
# `SandboxPolicy`/`ApprovalChannel` for the sandbox HTTP client,
# the AI Domain types the streaming accumulator emits.
openspace-shared = { path = "../shared" }
async-trait = { workspace = true }
# `async-stream` lets the alternative wire-format adapter compose the
# byte-stream → JSON-NL parse → `StreamEvent` pipeline as a single
# `try_stream!` block. Hand-rolling the equivalent state machine on
# top of `futures::stream::unfold` is workable but readability falls
# off a cliff once cancellation, error fan-out, and a stateful parser
# all live in the same loop. Locking the dep at the workspace level
# keeps later adapters from drifting versions.
async-stream = { workspace = true }
bytes = { workspace = true }
# `chrono` parses HTTP-date `Retry-After` headers in the
# error-mapping path of the openai-compatible provider. The
# workspace pin already restricts to `std + serde + clock`.
chrono = { workspace = true }
futures = { workspace = true }
# `reqwest` carries the workspace-level feature pin (`rustls-tls`,
# `http2`, `json`, `stream`). The sandboxed HTTP client builds on
# those features; adapters never reach past it.
reqwest = { workspace = true }
# `serde` + `serde_json` power the streaming `ToolCallAccumulator`
# (its assembled output round-trips through serde and the parser
# leans on `serde_json::from_str` for the final structural check)
# and the JSON request bodies the sandbox HTTP client sends.
serde = { workspace = true }
serde_json = { workspace = true }
# `static_assertions` pins `Send + Sync` invariants at compile time
# — matches the convention `openspace-shared` established so the
# streaming helpers cannot accidentally regress to a non-thread-
# safe shape.
static_assertions = { workspace = true }
# `thiserror` keeps the error enums (`AccumulatorError`,
# `ToolCallParseError`, `HttpClientError`) ergonomic without
# hand-rolled `Display` / `Error` impls.
thiserror = { workspace = true }
# `tokio` is needed at runtime for the timer the sandbox gate uses
# to bound approval waits. The workspace pin already trims to
# `macros + rt-multi-thread`; we layer `time` and `sync` for the
# timeout primitive and for cross-task channels in `test_support`.
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time", "sync"] }
tracing = { workspace = true }
url = { workspace = true }
# `keyring` powers the OS-keychain-backed `SecretStore` implementation.
#
# Backend wiring is target-gated inside the crate itself (no Cargo
# features to choose): on macOS / iOS the native keychain backend is
# pulled in automatically, on Windows the native credential store, on
# Linux / FreeBSD a secret-service backend over D-Bus. On headless or
# minimal Linux systems where no secret-service daemon is running the
# IPC call fails at runtime; `KeyringSecretStore` translates that
# error into `SecretError::Unavailable` so the agent loop can surface
# an actionable diagnostic instead of panicking.
#
# Pinned at the crate manifest (not the workspace) because no other
# crate needs `keyring` today. Pinned at v3 — the v4 line splits its
# error surface across an extra `keyring-core` crate without adding
# functionality this slice needs.
keyring = "3"

[dev-dependencies]
# Pull `openspace-shared` again with `test-support` so any fixtures
# the integration tests share with later provider slices are
# reachable without changing the production-time feature shape.
openspace-shared = { path = "../shared", features = ["test-support"] }
# `chrono` shows up in unit and integration tests when fabricating
# `Turn::created_at` timestamps. The production code does not need
# it directly — the request body construction is timestamp-free —
# so the dep stays scoped to dev-dependencies.
chrono = { workspace = true }
proptest = { workspace = true }
# `serde_json` is also a runtime dep, but listing it as a dev-dep
# in parallel makes the streaming-reassembly tests' intent
# explicit and matches the convention `openspace-shared`
# established for round-trip fixtures.
serde_json = { workspace = true }
# Tests need extra tokio surface (TCP listener, IO traits) that
# production code does not.
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time", "sync", "net", "io-util"] }
wiremock = { workspace = true }

[features]
# Default features stay empty so production builds carry only the
# transport surface and never the in-memory secret-store double or
# approval-channel stubs.
#
# Downstream crates that want any of those opt in via
# `[dev-dependencies]`:
#   openspace-ai-providers = { path = "...", features = ["test-support"] }
default = []

# `test-support` gates the test scaffolding: `InMemorySecretStore`
# (issue #43) and the approval-channel stubs (`AlwaysApprove`,
# `AlwaysDeny`, `NeverAnswer`, `ScriptedChannel` — issue #44).
# Mirrors the convention `openspace-shared` established —
# feature-gated test scaffolding lives next to the production
# code so a swap-in test double cannot drift from the real trait
# surface, but the fixture itself is never compiled into a
# release artefact.
test-support = []

# Integration tests in `tests/sandboxed_http_client.rs` consume the
# `test_support` module, which is itself behind the `test-support`
# feature. Declaring `required-features` here means `cargo test`
# (no flags) skips the integration test cleanly, while
# `cargo test --features test-support` picks it up — exactly the
# acceptance-criteria invocation in issue #44.
[[test]]
name = "sandboxed_http_client"
path = "tests/sandboxed_http_client.rs"
required-features = ["test-support"]

# Same gating as `sandboxed_http_client`: the alternative wire-format
# adapter's integration tests construct an `InMemorySecretStore` and
# the approval-channel doubles, both of which live behind
# `test-support`. Declaring `required-features` here lets `cargo test`
# (no flags) skip the file cleanly while
# `cargo test --features test-support` picks it up — matches the
# acceptance criteria invocation in issue #48.
[[test]]
name = "anthropic_provider"
path = "tests/anthropic_provider.rs"
required-features = ["test-support"]

# Same `required-features` rationale as the sandbox client tests:
# the openai-compatible integration tests reach for the
# `InMemorySecretStore` and the approval-channel stubs, both of
# which live behind `test-support`.
[[test]]
name = "openai_compatible"
path = "tests/openai_compatible.rs"
required-features = ["test-support"]

[lints]
workspace = true
