[package]
name = "openspace-ai-providers"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "AI provider adapters and supporting infrastructure for OpenSpace."

# This crate hosts the runtime-side machinery that turns the
# `openspace-shared::ai::provider::AiProvider` trait surface into
# working backends — HTTP clients, secret-store implementations,
# wire-format adapters. The current slice (issue #43) only ships the
# crate skeleton and the `InMemorySecretStore` test double; later
# slices add the OS-keychain backend, the `ToolCallAccumulator` deep
# module, and the concrete provider adapters.
[dependencies]
# `openspace-shared` carries the `SecretStore` trait, the `SecretRef`
# handle, and the `SecretError` enum this crate's in-memory backend
# implements. The path dependency is intentional — every workspace
# crate goes through `path = "..."` so a checkout builds without
# resolver gymnastics.
openspace-shared = { path = "../shared" }
# `serde` + `serde_json` power the streaming `ToolCallAccumulator`:
# its assembled output round-trips through serde and the parser
# leans on `serde_json::from_str` for the final structural check.
serde = { workspace = true }
serde_json = { workspace = true }
# `thiserror` keeps the error enums (`AccumulatorError`,
# `ToolCallParseError`) ergonomic without hand-rolled `Display` /
# `Error` impls.
thiserror = { workspace = true }
# `static_assertions` pins `Send + Sync` invariants at compile time
# — matches the convention in `openspace-shared` so the streaming
# helpers cannot accidentally regress to a non-thread-safe shape.
static_assertions = { workspace = true }

[dev-dependencies]
proptest = { workspace = true }
# `serde_json` is also a runtime dep, but listing it as a dev-dep in
# parallel makes the streaming-reassembly tests' intent explicit and
# matches the convention `openspace-shared` established for round-
# trip fixtures.
serde_json = { workspace = true }

[features]
# Default features stay empty so production builds never carry the
# in-memory secret-store double. Downstream crates that want the
# fixture opt in via `[dev-dependencies]`:
#   openspace-ai-providers = { path = "...", features = ["test-support"] }
default = []

# `test-support` gates the `InMemorySecretStore` fixture. Mirrors the
# convention `openspace-shared` established — feature-gated test
# scaffolding lives next to the production code so a swap-in test
# double cannot drift from the real trait surface, but the fixture
# itself is never compiled into a release artefact.
test-support = []

[lints]
workspace = true
