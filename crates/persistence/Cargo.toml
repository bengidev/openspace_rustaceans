[package]
name = "openspace-persistence"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "On-disk persistence for OpenSpace — SQLite-backed repositories and the settings TOML pipeline."

# PRD-03 lands the SQLite/FTS5-backed repositories, the settings-TOML
# pipeline, and the migration runner across follow-up slices. The
# foundation slice (issue #63) shipped this crate as a skeleton so:
#
#   - the workspace member shape was in place before downstream slices
#     started adding `[dependencies]`;
#   - `openspace-shared::persistence`'s trait surface had a concrete
#     home for its impls without retroactively wiring a new crate;
#   - the build / test / clippy / rustdoc gates ran green from the
#     first slice rather than breaking on the second.
#
# Slice 3 (issue #65) then introduced `SettingsStore` — the in-process
# owner of `settings.toml` — and pulled in the deps needed to read,
# atomically write, and roundtrip the TOML shape on the blocking pool.
# Slice 4 (issue #66) layered hot reload on top of the same store via
# a `notify` watcher and a tokio `broadcast` channel.
#
# Hard rules (mirrors the conventions `openspace-ai-providers`
# established):
#
#   - Domain types (the repository trait surface, `PersistenceError`,
#     supporting handle types, `Settings`) live in `openspace-shared`.
#     This crate consumes them; nothing here leaks back into the
#     Domain layer.
#   - Storage backends, SQL, file IO, atomic-write semantics, and
#     migration plumbing are in scope for *this* crate, never for
#     `openspace-shared`. The Domain crate must stay testable without
#     a database file or a settings.toml on disk.
#   - No third-party product names enter identifiers, doc comments,
#     or error strings — the abstract aliases ("on-disk store",
#     "SQL backend", "settings file") carry the meaning instead.
[dependencies]
# Pulled in so the impl crate can reach the trait surface, the error
# enum, the supporting handle types it implements, and the `Settings`
# schema the `SettingsStore` reads / writes.
openspace-shared = { path = "../shared" }

# `tokio` carries the blocking pool the `SettingsStore` dispatches
# file IO onto (`spawn_blocking`) so the UI thread never blocks on
# disk operations — US#9 in PRD-03. We pull `rt` for the runtime
# handle, `sync` for `Mutex` and `broadcast` (the write serialiser
# plus the hot-reload event channel that publishes `SettingsChanged`
# to subscribers), and `macros` so the unit tests in this crate can
# use `#[tokio::test]`. `time` is pulled in so the watcher's debounce
# loop can sleep between coalesced events without hand-rolling a
# timer thread.
tokio = { workspace = true, features = ["rt", "sync", "macros", "time"] }

# `toml` is the wire-format encoder/decoder for `settings.toml`.
# Workspace pin keeps it in lockstep with the read-side fixtures in
# `openspace-shared::settings`.
toml = { workspace = true }

# `serde` is reached for derives on the internal write-pipeline
# types (the `SettingsStore` itself does not derive serde, but
# downstream slices in this crate will, and pulling the workspace
# pin once keeps the surface stable).
serde = { workspace = true }

# `tracing` is used to emit a structured event when the atomic write
# fails partway through so operators have a breadcrumb trail without
# the store leaking partial-write detail through the error surface.
tracing = { workspace = true }

# `static_assertions` pins the `Send + Sync` invariant on the
# `SettingsStore` at compile time. Matches the convention every
# other crate in the workspace established.
static_assertions = { workspace = true }

# `rusqlite` carries the SQL backend the migration runner (and every
# repository impl that lands in later PRD-03 slices) talks to. The
# workspace pin uses the `bundled` feature so contributors compile
# against a known-good SQLite version without needing a system
# library at the right version.
rusqlite = { workspace = true }

# `tokio_rusqlite` wraps the `rusqlite` connection in a tokio-friendly
# handle that dispatches every SQL call onto the blocking pool. PRD-03
# Slice 6 introduces the [`Database`] handle that owns one of these
# per process; later repository slices borrow it through a clone-cheap
# `Arc` wrapper so the UI thread never blocks on disk IO (US#9).
tokio-rusqlite = { workspace = true }

# `thiserror` derives the local-only error mapping from `rusqlite`
# failures into [`PersistenceError`] variants — the migration runner
# carries no public error of its own; every fault funnels through
# the Domain enum.
thiserror = { workspace = true }

# `notify` is the cross-platform filesystem watcher used by
# `SettingsStore`'s hot-reload path. The store spawns a
# `RecommendedWatcher` on the parent directory of the settings file
# at construction; on each write event the file is re-parsed and the
# in-memory snapshot is swapped under the existing `RwLock`. Pinned
# via the workspace.
notify = { workspace = true }

[dev-dependencies]
# `tempfile` provides isolated scratch directories for the
# `SettingsStore` tests — each test owns its own tempdir that is
# cleaned up regardless of pass / fail.
tempfile = { workspace = true }
# Tests need extra tokio surface (`rt-multi-thread`, `time`) that
# production code does not — `#[tokio::test(flavor = "multi_thread")]`
# is what exercises the `spawn_blocking` path in the atomic-write
# scenarios.
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread", "sync", "time"] }

[lints]
workspace = true
